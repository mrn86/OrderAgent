[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-expert"
version = "1.5.0"
requires-python = ">=3.11"
dependencies = ["agent-common"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "agent_a2a*", "prompts*", "access*"]
