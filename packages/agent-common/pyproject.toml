[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-common"
version = "1.5.0"
description = "Shared loop, tools, audit, and A2A expert dispatch for orderAgent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-litellm>=0.10.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "litellm>=1.55.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "redis>=5.2.0",
    "a2a-sdk[http-server]>=1.2.0",
    "httpx>=0.27.0",
    "mcp>=2.0",
]

[tool.setuptools.package-dir]
"" = "../../backend"

[tool.setuptools.packages.find]
where = ["../../backend"]
include = ["app*"]
